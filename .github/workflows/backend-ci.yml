name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt into Node.js 24 now

jobs:
  # ── Lint & format check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]" bcrypt

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Black format check
        run: black --check app/ tests/

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" aiosqlite bcrypt

      - name: Run tests
        env:
          LOCAL_AUTH: "true"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-only-not-used-in-production-32chars"
          COGNITO_REGION: "eu-west-1"
          COGNITO_USER_POOL_ID: "eu-west-1_PLACEHOLDER"
          COGNITO_CLIENT_ID: "placeholder"
          S3_BUCKET_NAME: "gatherease-ci-test"
          AWS_REGION: "eu-west-1"
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: pytest --cov=app --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend
        if: github.event_name == 'push'

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gatherease-backend:${{ github.sha }} .

