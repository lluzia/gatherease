# GatherEase — local development services
# Replaces all AWS dependencies during development.
#
# Usage:
#   docker compose up -d        # start everything in background
#   docker compose down         # stop everything
#   docker compose down -v      # stop + delete all data (fresh start)
#
# Services:
#   postgres  → postgresql://postgres:password@localhost:5432/gatherease
#   minio     → S3-compatible storage at http://localhost:9000
#   mailpit   → catches all emails locally at http://localhost:8025

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gatherease-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatherease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gatherease"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: gatherease-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API  → use in .env as S3 endpoint
      - "9001:9001"   # Web UI  → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO bucket setup (runs once, creates the bucket) ────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: gatherease-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/gatherease-assets-dev;
        mc anonymous set download local/gatherease-assets-dev;
        echo 'MinIO bucket ready';
      "
    restart: "no"

  # ── Mailpit (catches all outgoing emails locally) ─────────────────────────
  # Visit http://localhost:8025 to read emails (registration codes, resets)
  mailpit:
    image: axllent/mailpit:latest
    container_name: gatherease-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
  minio_data:
